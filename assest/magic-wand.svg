<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Soft magical glow radiating from the wand tip -->
    <radialGradient id="wandAuraGlow" cx="23" cy="9" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffe680" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#e8a838" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c98218" stop-opacity="0" />
    </radialGradient>

    <!-- Warm polished wand wood gradient -->
    <linearGradient id="wandWood" x1="4" y1="28" x2="23" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d1d0e" />
      <stop offset="25%" stop-color="#693b1c" />
      <stop offset="55%" stop-color="#9e6232" />
      <stop offset="85%" stop-color="#cf9753" />
      <stop offset="100%" stop-color="#f5d48b" />
    </linearGradient>

    <!-- Highlight along the upper spine of the wand -->
    <linearGradient id="wandSpine" x1="4.5" y1="26.5" x2="22.5" y2="8.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c88b43" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#fff1be" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Golden Spell Casting Aura -->
  <circle cx="23" cy="9" r="8.5" fill="url(#wandAuraGlow)" />

  <!-- Wand Pommel (rounded end cap) -->
  <circle cx="4.8" cy="27.2" r="1.6" fill="#381b0c" stroke="#cf9753" stroke-width="0.8" />

  <!-- Tapered Wand Shaft -->
  <polygon points="4.2,26.4 5.6,27.8 23,9.8 22.2,9" fill="url(#wandWood)" stroke="#2b1408" stroke-width="0.5" stroke-linejoin="round" />

  <!-- Specular Light Reflection on Upper Edge -->
  <line x1="4.5" y1="26.2" x2="22.2" y2="8.6" stroke="url(#wandSpine)" stroke-width="0.7" stroke-linecap="round" />

  <!-- Ornate Wizarding Handle Gold Rings -->
  <line x1="6.8" y1="23.2" x2="9" y2="25.4" stroke="#f6cf65" stroke-width="1.1" stroke-linecap="round" />
  <line x1="9.4" y1="20.6" x2="11.6" y2="22.8" stroke="#f6cf65" stroke-width="1.1" stroke-linecap="round" />
  <line x1="12" y1="18" x2="13.8" y2="19.8" stroke="#e0a93b" stroke-width="0.9" stroke-linecap="round" />

  <!-- Primary Starlight Starburst at Tip (23, 9) -->
  <path d="M23 2.5 L24.3 7.5 L29.5 9 L24.3 10.5 L23 15.5 L21.7 10.5 L16.5 9 L21.7 7.5 Z" fill="#ffffff" stroke="#f3c242" stroke-width="0.65" stroke-linejoin="round" />

  <!-- Diagonal Radiant Rays -->
  <line x1="19.5" y1="5.5" x2="26.5" y2="12.5" stroke="#ffeaa5" stroke-width="0.8" stroke-linecap="round" />
  <line x1="26.5" y1="5.5" x2="19.5" y2="12.5" stroke="#ffeaa5" stroke-width="0.8" stroke-linecap="round" />

  <!-- Micro Magic Embers / Sparks -->
  <circle cx="28" cy="5" r="0.9" fill="#ffffff" />
  <circle cx="17" cy="4.5" r="0.8" fill="#ffd868" />
  <circle cx="28.5" cy="13.5" r="0.75" fill="#ffd868" />
  <circle cx="18" cy="14" r="0.7" fill="#ffffff" />
  <circle cx="23" cy="9" r="1.4" fill="#ffffff" />
</svg>
